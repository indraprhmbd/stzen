name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time per branch: a second push waits instead of racing
# the first inside Cloudflare.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck + migration lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck server
        run: npm run build --workspace=server
      - name: Typecheck client
        run: npx tsc --noEmit -p client
      - name: Lint migrations
        run: npm run lint:migrations --workspace=server

  deploy-worker:
    name: Deploy API Worker (production)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.129.0
          command: deploy --cwd server --env production

  # Frontend ships via Cloudflare Pages dashboard Git integration (build:
  # `npm run build --workspace=client`, output: `client/dist`), which gives
  # preview deployments per PR for free. No CI deploy step needed.

  deploy-staging:
    name: Deploy API Worker (staging)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy to Cloudflare Workers (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.129.0
          command: deploy --cwd server --env staging

  migrate:
    name: Run DB migrations (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply pending migrations
        run: npm run db:migrate --workspace=server
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
