name: Security (Snyk)

on:
  pull_request:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  snyk-code:
    name: Snyk SAST (fail on high+)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Snyk Code test (server + client)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test --severity-threshold=high --all-projects

  snyk-deps:
    name: Snyk SCA (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Snyk Open Source test
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test --severity-threshold=high --all-projects
