name: client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/app.ts'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'server/app.ts'
      - '.github/workflows/client.yml'

jobs:
  typecheck-build-budget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # client tsconfig includes ../server/app.ts for hc<AppType>, so server
      # deps (hono types) must exist for tsc to resolve.
      - name: Install server deps (AppType typecheck source)
        run: npm ci
        working-directory: server

      - name: Install client deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Bundle budget
        run: node scripts/check-bundle.mjs
